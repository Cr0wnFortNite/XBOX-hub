name: Aggiorna notizie
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica le notizie
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, re, html, datetime, email.utils
          FEEDS = [("Xbox Wire", "https://news.xbox.com/en-us/feed/"),
                   ("Pure Xbox", "https://www.purexbox.com/feeds/news")]
          def clean(s):
              s = re.sub(r"<[^>]+>", " ", html.unescape(s or ""))
              return re.sub(r"\s+", " ", s).strip()
          def when(s):
              try:
                  return email.utils.parsedate_to_datetime(s).astimezone(datetime.timezone.utc)
              except Exception:
                  try:
                      return datetime.datetime.fromisoformat((s or "").replace("Z", "+00:00"))
                  except Exception:
                      return None
          def short(s, n=240):
              return s if len(s) <= n else s[:n].rsplit(" ", 1)[0] + "…"
          items = []
          for name, url in FEEDS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (xbox-hub news bot)"})
                  root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
                  A = "{http://www.w3.org/2005/Atom}"
                  rows = list(root.iter("item")) or list(root.iter(A + "entry"))
                  for it in rows[:8]:
                      title = clean(it.findtext("title") or it.findtext(A + "title"))
                      desc = clean(it.findtext("description") or it.findtext(A + "summary") or it.findtext(A + "content"))
                      d = when(it.findtext("pubDate") or it.findtext(A + "published") or it.findtext(A + "updated"))
                      if title:
                          items.append({"source": name, "title": title, "text": short(desc) or title,
                                        "date": d.isoformat() if d else ""})
                  print("ok", name, len(rows))
              except Exception as e:
                  print("feed failed", name, e)
          items.sort(key=lambda x: x["date"], reverse=True)
          items = items[:12]
          if items:
              json.dump({"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "items": items},
                        open("news.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          else:
              print("nessuna notizia scaricata: tengo il file precedente")
          PY
      - name: Salva
        run: |
          git config user.name "xbox-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json || true
          git diff --cached --quiet || (git commit -m "Aggiorna notizie" && git push)

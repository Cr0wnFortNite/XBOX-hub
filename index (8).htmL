<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XBOX hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XBOX hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f2f5f2;--card:#fff;--text:#13201a;--muted:#5b6b62;--line:#d9e2dc;--green:#107c10;--green2:#0b5d0b;--ong:#fff;--chip:#e6f3e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0c120e;--card:#151e18;--text:#eaf2ec;--muted:#93a69a;--line:#25332a;--green:#2ea82e;--green2:#47c247;--ong:#06130a;--chip:#193320}}
:root[data-theme="light"]{--bg:#f2f5f2;--card:#fff;--text:#13201a;--muted:#5b6b62;--line:#d9e2dc;--green:#107c10;--green2:#0b5d0b;--ong:#fff;--chip:#e6f3e6}
:root[data-theme="dark"]{--bg:#0c120e;--card:#151e18;--text:#eaf2ec;--muted:#93a69a;--line:#25332a;--green:#2ea82e;--green2:#47c247;--ong:#06130a;--chip:#193320}
:root[data-theme="xbox"]{--bg:#0b5d0b;--card:#0e700e;--text:#fff;--muted:#c8efc8;--line:#2f9a2f;--green:#fff;--green2:#c9ffc9;--ong:#0b5d0b;--chip:#13851a}
:root[data-theme="anniv"]{--bg:linear-gradient(160deg,#03130b,#0a3b25 55%,#04180e);--card:rgba(150,255,200,.09);--text:#eafff3;--muted:#9fd8b8;--line:rgba(170,255,210,.3);--green:#7dffb0;--green2:#9dffc4;--ong:#04230f;--chip:rgba(125,255,176,.15)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) fixed;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="anniv"] .page,:root[data-theme="anniv"] .tile,:root[data-theme="anniv"] .panel{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:30}
.top-bar{background:#000;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-bar a{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.top-bar img{height:38px;width:auto}
.gear{margin-left:auto;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 6px}
main{max-width:860px;margin:0 auto;padding:14px}
.view{display:none}.view.on{display:block}
.hero{background:#000;border-radius:18px;text-align:center;padding:18px;color:#fff}
.hero img{width:130px;max-width:45%}
.hero h1{margin:8px 0 2px;font-size:1.8rem}
.hero p{margin:0;color:#9fd69f;font-size:.9rem}
.grid{display:grid;gap:12px;margin-top:14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile .ic{font-size:2rem}.tile b{display:block;font-size:1.1rem;margin-top:4px}.tile span{color:var(--muted);font-size:.85rem}
.back{display:inline-block;margin:2px 0 10px;color:var(--green2);font-weight:700;text-decoration:none}
.page{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{margin:0 0 4px;font-size:1.3rem}
.sub{margin:0 0 12px;color:var(--muted);font-size:.82rem}
details{border-top:1px solid var(--line);padding:11px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary b{display:block}
details p{margin:8px 0 2px;font-size:.95rem}
.tag{display:inline-block;background:var(--chip);color:var(--green2);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1;min-width:90px;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--green);color:var(--ong);border-color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.price{font-weight:800;font-size:1.1rem;color:var(--green2)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.pos{font-size:1.5rem;font-weight:900;color:var(--green2);width:28px;text-align:center}
.score{margin-left:auto;background:var(--green);color:var(--ong);font-weight:800;border-radius:10px;padding:6px 11px}
.item small{color:var(--muted);display:block}
.counters{display:grid;gap:12px}
@media(min-width:640px){.counters{grid-template-columns:1fr 1fr}}
.ctr{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--bg)}
:root[data-theme="anniv"] .ctr{background:rgba(0,0,0,.2)}
.ctr h3{margin:0;font-size:1rem}
.cico{height:72px;width:72px;object-fit:contain;background:#0c120e;border-radius:50%;padding:8px;margin:0 auto 6px;display:block}
.num{font-size:3rem;font-weight:900;line-height:1.15;color:var(--green2)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btns button{min-width:62px;padding:10px 14px;border:0;border-radius:10px;background:var(--green);color:var(--ong);font-weight:800;font-size:1rem;cursor:pointer}
.btns button:active{transform:scale(.96)}
.btns button.alt{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btns button.big{background:var(--text);color:var(--bg)}
:root[data-theme="anniv"] .btns button.big{background:#eafff3;color:#04230f}
.yr{font-weight:900;color:var(--green2);min-width:78px;font-size:.95rem;align-self:flex-start;padding-top:2px}.item b{display:block}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:6px 16px 28px}
footer img{height:44px;background:#000;border-radius:10px;padding:4px 10px;display:block;margin:0 auto 8px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
#ov.on{display:flex}
.panel{background:var(--card);color:var(--text);border:1px solid var(--line);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
:root[data-theme="xbox"] .panel{background:#0b5d0b}
@media(min-width:560px){#ov{align-items:center}.panel{border-radius:20px}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ph h2{margin:0}
.ph button{background:none;border:0;color:var(--text);font-size:1.4rem;cursor:pointer}
.panel h4{margin:14px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.vrow{display:flex;justify-content:space-between;align-items:center}
.sw{width:54px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:27px;background:var(--ong)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:.9rem;display:none;max-width:90%;text-align:center}
</style>
</head>

it:[["OFFERTE","Black Friday Xbox: i saldi partono il 19 novembre","Microsoft ha annunciato il Black Friday Xbox 2026: parte giovedì 19 novembre e, secondo la pagina del Microsoft Store, dura fino al 28 novembre. Una lista trapelata parla di oltre 3.500 prodotti in sconto, tra giochi, accessori e console; tra i titoli citati ci sono 007 First Light e Ace Combat 8 (sconti e prezzi non ancora confermati)."],
["GAME PASS","Game Pass: seconda ondata di novembre","Microsoft ha svelato la seconda ondata di novembre per Game Pass, con High on Life 2, The Outlast Trials, Hela: of Mice & Magic e Motorslice. Otto giochi lasceranno invece il servizio il 30 novembre."],
["TECNOLOGIA","FSR 4.1 per Xbox Series X|S","AMD FSR Upscaling 4.1.2 è ora disponibile per gli sviluppatori su Xbox Series X|S. Non migliora automaticamente tutti i giochi: ogni titolo deve scegliere di adottarlo."],
["HARDWARE","Xbox Series X25: è uscita, ora il rifornimento","La Xbox Series X25, edizione limitata per i 25 anni di Xbox, è uscita il 13 novembre a 899,99 $ (759,99 £ nel Regno Unito). Dopo che era andata esaurita, Microsoft ha rimesso in vendita nuove scorte (le prenotazioni erano limitate a una per cliente)."],

en:[["DEALS","Xbox Black Friday: sale starts November 19","Microsoft announced the 2026 Xbox Black Friday sale: it starts Thursday, November 19 and, per the Microsoft Store page, runs through November 28. A leaked list mentions over 3,500 discounted items across games, accessories and consoles; titles named include 007 First Light and Ace Combat 8 (discounts and prices not yet confirmed)."],
["GAME PASS","Game Pass: second November wave","Microsoft revealed the second November wave for Game Pass, including High on Life 2, The Outlast Trials, Hela: of Mice & Magic and Motorslice. Eight games leave the service on November 30."],
["TECH","FSR 4.1 for Xbox Series X|S","AMD FSR Upscaling 4.1.2 is now available to developers on Xbox Series X|S. It doesn’t improve every game automatically: each title has to opt in."],
["HARDWARE","Xbox Series X25: out now, restocked","The Xbox Series X25, the limited edition for Xbox’s 25th anniversary, launched November 13 at $899.99 (£759.99 in the UK). After selling out, Microsoft put fresh stock back on sale (preorders were limited to one per customer)."],
["CLOUD","Free cloud gaming expands","Xbox has extended its free cloud gaming tier to many more players, starting today."],
["STORE","Four games leaving the store","An Xbox publisher announced that four of its games will be delisted by the end of 2026. If you have any on your wishlist, buy them first."],

es:[["OFERTAS","Black Friday Xbox: las rebajas empiezan el 19 de noviembre","Microsoft anunció el Black Friday Xbox 2026: empieza el jueves 19 de noviembre y, según la página de Microsoft Store, dura hasta el 28. Una lista filtrada habla de más de 3.500 productos rebajados entre juegos, accesorios y consolas; entre los títulos citados están 007 First Light y Ace Combat 8 (descuentos y precios sin confirmar)."],

["TECNOLOGÍA","FSR 4.1 para Xbox Series X|S","AMD FSR Upscaling 4.1.2 ya está disponible para desarrolladores en Xbox Series X|S. No mejora automáticamente todos los juegos: cada título debe adoptarlo."],
["HARDWARE","Xbox Series X25: ya a la venta y con reposición","La Xbox Series X25, edición limitada por los 25 años de Xbox, salió el 13 de noviembre a 899,99 $ (759,99 £ en Reino Unido). Tras agotarse, Microsoft volvió a poner stock a la venta (las reservas se limitaron a una por cliente)."],
["CLOUD","El cloud gaming gratuito se amplía","Xbox ha extendido el nivel gratuito del cloud gaming a muchos más jugadores, desde hoy."],
["TIENDA","Cuatro juegos saldrán de la tienda","Un publisher de Xbox anunció que cuatro de sus juegos se retirarán de la tienda antes de que acabe 2026. Si tienes alguno en tu lista de deseos, mejor cómpralo antes."],
["LANZAMIENTOS","Más de 10 juegos salen el 12 de noviembre","El 12 de noviembre salieron más de diez juegos de Xbox, entre ellos un shooter de zombis muy visceral disponible en Game Pass."]],

["GAME PASS","Game Pass : deuxième vague de novembre","Microsoft a dévoilé la deuxième vague de novembre du Game Pass, avec High on Life 2, The Outlast Trials, Hela: of Mice & Magic et Motorslice. Huit jeux quitteront le service le 30 novembre."],
["TECHNO","FSR 4.1 pour Xbox Series X|S","AMD FSR Upscaling 4.1.2 est désormais disponible pour les développeurs sur Xbox Series X|S. Il n’améliore pas automatiquement tous les jeux : chaque titre doit l’adopter."],
["HARDWARE","Xbox Series X25 : disponible, puis réassort","La Xbox Series X25, édition limitée pour les 25 ans de Xbox, est sortie le 13 novembre à 899,99 $ (759,99 £ au Royaume-Uni). Après rupture de stock, Microsoft a remis des unités en vente (les précommandes étaient limitées à une par client)."],
["CLOUD","Le cloud gaming gratuit s’élargit","Xbox a étendu son offre gratuite de cloud gaming à beaucoup plus de joueurs, dès aujourd’hui."],
["BOUTIQUE","Quatre jeux retirés de la boutique","Un éditeur Xbox a annoncé que quatre de ses jeux seront retirés de la boutique d’ici fin 2026. Si tu en as en liste de souhaits, mieux vaut les acheter avant."],

var lang=ld("xh_lang","it"),theme=ld("xh_theme",""),notif=ld("xh_notif","0")==="1",region="us";
if(!T[lang])lang="it";
if(!theme)theme=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";

function setTheme(t){theme=t;document.documentElement.setAttribute("data-theme",t);sv("xh_theme",t);
  document.querySelectorAll("#thm button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});}
function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600);
  try{if(notif&&"Notification" in window&&Notification.permission==="granted")new Notification("XBOX hub",{body:m})}catch(x){}}
function list(id,rows){var h="";rows.forEach(function(r,i){h+='<div class="item"><div class="pos">'+(i+1)+'</div><div><b>'+r[0]+'</b><small>'+r[1]+'</small></div>'+(r[2]?'<div class="score">'+r[2]+'</div>':'')+'</div>'});$(id).innerHTML=h}
function render(){
  var t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t[e.dataset.i]});
  document.querySelectorAll("[data-reset]").forEach(function(b){b.dataset.arm=""});
  $("rgeu").textContent=t.rgeu;
  var h="";NEWS[lang].forEach(function(n){h+='<details><summary><span class="tag">'+n[0]+'</span><b>'+n[1]+'</b></summary><p>'+n[2].replace(/&/g,"&amp;")+'</p></details>'});$("news").innerHTML=h;
  var M=["Series S 512GB","Series S 1TB","Series X Digital 1TB","Series X 1TB "+t.disc];h="";
  P[region].forEach(function(p,i){h+='<div class="row"><span>'+M[i]+'</span><span class="price">'+p+'</span></div>'});$("plist").innerHTML=h;
  document.querySelectorAll("#seg button").forEach(function(b){b.classList.toggle("on",b.dataset.r===region)});
  list("sold",SOLD);list("rated",RATED);list("recs",RN.map(function(n,i){return [n,REC[lang][i]]}));
  document.querySelectorAll("#lng button").forEach(function(b){b.classList.toggle("on",b.dataset.l===lang)});
  $("nlab").textContent=notif?t.on:t.off;$("sw").classList.toggle("on",notif);
  $("ver").textContent="XBOX hub v"+VER;extra();
}
var V=["home","notizie","prezzi","venduti","apprezzati","consigliati","storia","limited","contatori"];
function route(){var h=(location.hash||"").replace("#","");if(V.indexOf(h)<0)h="home";
  V.forEach(function(v){$("v-"+v).classList.toggle("on",v===h)});window.scrollTo(0,0)}
window.addEventListener("hashchange",route);window.addEventListener("popstate",route);
document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest('a[href^="#"]'):null;if(!a)return;
  e.preventDefault();var h=a.getAttribute("href");try{history.pushState(null,"",h)}catch(x){location.hash=h}route()});

$("gear").onclick=function(){$("ov").classList.add("on")};
$("xs").onclick=function(){$("ov").classList.remove("on")};
$("ov").onclick=function(e){if(e.target===$("ov"))$("ov").classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("ov").classList.remove("on")});
document.querySelectorAll("#thm button").forEach(function(b){b.onclick=function(){setTheme(b.dataset.t)}});
document.querySelectorAll("#lng button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;sv("xh_lang",lang);render()}});
document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){region=b.dataset.r;render()}});
$("sw").onclick=function(){notif=!notif;sv("xh_notif",notif?"1":"0");render();
  if(notif){try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}toast(T[lang].nmsg)}};

var S={ach:0,myth:0},H={ach:[],myth:[]};
try{var raw=localStorage.getItem("xboxhub");if(raw){var o=JSON.parse(raw);S.ach=+o.ach||0;S.myth=+o.myth||0}}catch(e){}
function draw(){$("n-ach").textContent=S.ach;$("n-myth").textContent=S.myth}
function save(){sv("xboxhub",JSON.stringify(S))}
function mile(k,before,v){var step=k==="ach"?100:10,a=Math.floor(before/step),b=Math.floor(S[k]/step);
  if(notif&&b>a)toast(T[lang]["ms_"+k].replace("{n}",b*step))}
document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){var k=b.dataset.k,v=+b.dataset.v,bf=S[k];S[k]+=v;H[k].push(v);draw();save();mile(k,bf,v)}});
document.querySelectorAll("[data-undo]").forEach(function(b){b.onclick=function(){var k=b.dataset.undo,v=H[k].pop();if(v){S[k]=Math.max(0,S[k]-v);draw();save()}}});
document.querySelectorAll("[data-reset]").forEach(function(b){var tm;b.onclick=function(){var k=b.dataset.reset;
  if(b.dataset.arm){S[k]=0;H[k]=[];b.dataset.arm="";b.textContent=T[lang].reset;clearTimeout(tm);draw();save()}
  else{b.dataset.arm="1";b.textContent=T[lang].confirm;tm=setTimeout(function(){b.dataset.arm="";b.textContent=T[lang].reset},3000)}}});

setTheme(theme);render();draw();route();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
